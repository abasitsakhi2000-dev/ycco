# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Backend "git-gateway" uses Netlify Identity for login and commits changes
# straight into this GitHub repo. Requires the site to be deployed on Netlify
# with "Identity" and "Git Gateway" enabled (see SETUP-CMS.md).

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Content: create {{collection}} “{{slug}}”"
    update: "Content: update {{collection}} “{{slug}}”"
    delete: "Content: delete {{collection}} “{{slug}}”"
    uploadMedia: "Content: upload {{path}}"
    deleteMedia: "Content: delete {{path}}"

# Where uploaded images are stored in the repo and how they are referenced on the site.
# NOTE: not "images/uploads" on purpose — .gitignore ignores any "uploads/" folder.
media_folder: "images/news"
public_folder: "/images/news"

locale: "en"

collections:
  - name: "news"
    label: "News & Events"
    files:
      - name: "news_list"
        label: "News & Events"
        file: "content/news.json"
        description: "Add, edit, reorder or delete the entries shown in the News section of the website. The entry with the newest date is shown first automatically. The site shows up to the 6 most recent entries."
        fields:
          - name: "items"
            label: "Entries"
            label_singular: "Entry"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, default: "" }
              - { name: "image", label: "Image (optional)", widget: "image", required: false, allow_multiple: false, media_library: { config: { max_file_size: 3000000 } } }
              - { name: "summary", label: "Short text", widget: "text", hint: "1–3 sentences shown on the card." }
              - { name: "link", label: "Link (optional)", widget: "string", required: false, pattern: ['^(https?://|/).*', "Must start with https:// or /"], hint: "Optional. e.g. https://… — adds a “Read more” button." }
