# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Backend "github": the editor logs in with a GitHub account and Decap commits
# changes straight into this repo. Login runs through the small OAuth functions
# in netlify/functions/ (Netlify Identity is no longer offered for new projects).
# base_url must point to wherever the site + functions are served. See SETUP-CMS.md.

backend:
  name: github
  repo: abasitsakhi2000-dev/ycco
  branch: main
  base_url: https://www.infoycco.com
  auth_endpoint: /.netlify/functions/auth
  commit_messages:
    create: "Content: create {{collection}} “{{slug}}”"
    update: "Content: update {{collection}} “{{slug}}”"
    delete: "Content: delete {{collection}} “{{slug}}”"
    uploadMedia: "Content: upload {{path}}"
    deleteMedia: "Content: delete {{path}}"

# Where uploaded images are stored in the repo and how they are referenced on the site.
# NOTE: not "images/uploads" on purpose — .gitignore ignores any "uploads/" folder.
media_folder: "images/news"
public_folder: "/images/news"

locale: "en"

collections:
  - name: "news"
    label: "News & Events"
    files:
      - name: "news_list"
        label: "News & Events"
        file: "content/news.json"
        description: "Add, edit, reorder or delete the entries shown in the News section of the website. The entry with the newest date is shown first automatically. The site shows up to the 6 most recent entries."
        fields:
          - name: "items"
            label: "Entries"
            label_singular: "Entry"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, default: "" }
              - { name: "image", label: "Image (optional)", widget: "image", required: false, allow_multiple: false, media_library: { config: { max_file_size: 3000000 } } }
              - { name: "summary", label: "Short text", widget: "text", hint: "1–3 sentences shown on the card." }
              - { name: "link", label: "Link (optional)", widget: "string", required: false, pattern: ['^(https?://|/).*', "Must start with https:// or /"], hint: "Optional. e.g. https://… — adds a “Read more” button." }

  - name: "projects"
    label: "Current Projects"
    files:
      - name: "projects_list"
        label: "Current Projects"
        file: "content/projects.json"
        description: "Add, edit, reorder or delete the projects shown in the “Current Projects” section (below Programs). Each project can link to a Google Form so people can register."
        fields:
          - { name: "intro", label: "Intro text (optional)", widget: "text", required: false, hint: "Optional short paragraph shown above the projects." }
          - name: "items"
            label: "Projects"
            label_singular: "Project"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "status", label: "Status label (optional)", widget: "string", required: false, hint: "Small badge on the card, e.g. “Open for registration” or “Applications close 31 Aug”." }
              - { name: "description", label: "Description", widget: "text", hint: "The project text. Leave a blank line between paragraphs to split them." }
              - { name: "form_url", label: "Google Form link", widget: "string", required: false, pattern: ['^https://.*', "Must start with https://"], hint: "Paste the Google Form link here — it adds a “Register” button. Leave empty for no button." }
              - { name: "button_label", label: "Button text (optional)", widget: "string", required: false, default: "Register", hint: "Text on the button. Defaults to “Register”." }
