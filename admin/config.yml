# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Backend "github": the editor logs in with a GitHub account and Decap commits
# changes straight into this repo. Login runs through the small OAuth functions
# in netlify/functions/ (Netlify Identity is no longer offered for new projects).
# base_url must point to wherever the site + functions are served. See SETUP-CMS.md.

backend:
  name: github
  repo: abasitsakhi2000-dev/ycco
  branch: main
  base_url: https://www.infoycco.com
  auth_endpoint: /.netlify/functions/auth
  commit_messages:
    create: "Content: create {{collection}} “{{slug}}”"
    update: "Content: update {{collection}} “{{slug}}”"
    delete: "Content: delete {{collection}} “{{slug}}”"
    uploadMedia: "Content: upload {{path}}"
    deleteMedia: "Content: delete {{path}}"

# Where uploaded images are stored in the repo and how they are referenced on the site.
# NOTE: not "images/uploads" on purpose — .gitignore ignores any "uploads/" folder.
media_folder: "images/news"
public_folder: "/images/news"

locale: "en"

collections:
  - name: "news"
    label: "News & Events"
    files:
      - name: "news_list"
        label: "News & Events"
        file: "content/news.json"
        description: "Add, edit, reorder or delete the entries shown in the News section of the website. The entry with the newest date is shown first automatically. The site shows up to the 6 most recent entries."
        fields:
          - name: "items"
            label: "Entries"
            label_singular: "Entry"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, default: "" }
              - { name: "image", label: "Image (optional)", widget: "image", required: false, allow_multiple: false, media_library: { config: { max_file_size: 3000000 } } }
              - { name: "summary", label: "Short text", widget: "text", hint: "1–3 sentences shown on the card." }
              - { name: "link", label: "Link (optional)", widget: "string", required: false, pattern: ['^(https?://|/).*', "Must start with https:// or /"], hint: "Optional. e.g. https://… — adds a “Read more” button." }

  - name: "programs"
    label: "Programs"
    files:
      - name: "upcoming_events"
        label: "Upcoming Events"
        file: "content/events.json"
        description: "Manage the entries shown in the “Upcoming Events” section (under Programs). Events are sorted by date, soonest first. Add a Google Form link to let people register."
        fields:
          - { name: "intro", label: "Intro text (optional)", widget: "text", required: false, hint: "Optional short paragraph shown above the events." }
          - name: "items"
            label: "Events"
            label_singular: "Event"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, default: "", required: false, hint: "Shown as a badge; also used to sort events." }
              - { name: "location", label: "Location (optional)", widget: "string", required: false, hint: "e.g. Online, Kabul, Berlin…" }
              - { name: "description", label: "Description", widget: "text", hint: "Leave a blank line between paragraphs to split them." }
              - { name: "form_url", label: "Google Form link (optional)", widget: "string", required: false, pattern: ['^https://.*', "Must start with https://"], hint: "Paste the Google Form link — it adds a “Register” button. Leave empty for no button." }
              - { name: "button_label", label: "Button text (optional)", widget: "string", required: false, default: "Register", hint: "Defaults to “Register”." }

      - name: "scholarship"
        label: "Scholarship"
        file: "content/scholarship.json"
        description: "Manage the entries shown in the “Scholarship” section (under Programs). Add a Google Form or application link so people can apply."
        fields:
          - { name: "intro", label: "Intro text (optional)", widget: "text", required: false, hint: "Optional short paragraph shown above the scholarships." }
          - name: "items"
            label: "Scholarships"
            label_singular: "Scholarship"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "deadline", label: "Deadline (optional)", widget: "string", required: false, hint: "Free text, e.g. “31 August 2026” or “Rolling”. Shown as a badge." }
              - { name: "description", label: "Description", widget: "text", hint: "Leave a blank line between paragraphs to split them." }
              - { name: "form_url", label: "Application link (optional)", widget: "string", required: false, pattern: ['^https://.*', "Must start with https://"], hint: "Google Form or application page — adds an “Apply” button. Leave empty for no button." }
              - { name: "button_label", label: "Button text (optional)", widget: "string", required: false, default: "Apply", hint: "Defaults to “Apply”." }
