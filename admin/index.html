<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!--
    CSP for the CMS admin only. This is a login-gated tool page (noindex), so it is
    intentionally more permissive than the public site's CSP. It allows Decap CMS
    (unpkg) and Netlify Identity to load and talk to their backends.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://unpkg.com https://identity.netlify.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com;
    img-src 'self' data: blob: https:;
    font-src 'self' data:;
    connect-src 'self' https://unpkg.com https://identity.netlify.com https://api.netlify.com https://*.netlify.app wss://*.netlify.app https://api.github.com https://raw.githubusercontent.com https://avatars.githubusercontent.com;
    frame-src 'self' https://identity.netlify.com;
    child-src 'self' https://identity.netlify.com;
    form-action 'self';
    base-uri 'self';">
  <title>Content Manager — YCCO</title>
</head>
<body>
  <!-- Netlify Identity widget: handles login/invite for the editor. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS (formerly Netlify CMS). -->
  <script src="https://unpkg.com/decap-cms@^3.7.0/dist/decap-cms.js"></script>
  <script>
    // Redirect back into the CMS after an email-invite / password-recovery login.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
