<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!--
    CSP for the CMS admin only. This is a login-gated tool page (noindex), so it is
    intentionally more permissive than the public site's CSP. It allows Decap CMS
    (unpkg) to load and to talk to the GitHub API. The GitHub OAuth popup is a
    top-level navigation to the /.netlify/functions/* endpoints (same origin) and
    then to github.com, which is not restricted by connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com;
    img-src 'self' data: blob: https:;
    font-src 'self' data:;
    connect-src 'self' https://unpkg.com https://api.github.com https://raw.githubusercontent.com https://avatars.githubusercontent.com;
    frame-src 'self';
    form-action 'self' https://github.com;
    base-uri 'self';">
  <title>Content Manager — YCCO</title>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS). Login uses the GitHub backend. -->
  <script src="https://unpkg.com/decap-cms@^3.7.0/dist/decap-cms.js"></script>
</body>
</html>
