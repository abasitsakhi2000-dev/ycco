# Netlify deploy settings for this static site.
# With this file, importing the repo on Netlify needs no manual configuration:
# no build step, and the site is served straight from the repo root.

[build]
  publish = "."
  command = ""

# Serverless functions that handle the GitHub OAuth login for the CMS.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers applied to every response. CSP stays in the per-page <meta>
# tags on purpose (the public site and /admin need different policies), so it is
# not set here. X-Frame-Options is set as a real header because CSP
# frame-ancestors in a <meta> tag is ignored by browsers.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Let /admin resolve with or without a trailing slash.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
