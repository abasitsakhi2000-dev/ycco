# YCCO Website Security & Performance Configuration
# For Nginx Web Servers
# 
# Place this configuration in your nginx sites-available directory
# and create a symlink to sites-enabled

server {
    # Listen on port 80 (HTTP) and redirect to HTTPS
    listen 80;
    listen [::]:80;
    server_name infoycco.com www.infoycco.com;
    return 301 https://$server_name$request_uri;
}

server {
    # Listen on port 443 (HTTPS)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name infoycco.com www.infoycco.com;

    # SSL Configuration (adjust paths to your certificate)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Document root
    root /path/to/your/website;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com https://api.emailjs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;" always;

    # Remove server signature
    server_tokens off;

    # Disable ETags
    etag off;

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Allow specific hidden files (like .well-known for SSL verification)
    location ~ /\.well-known {
        allow all;
    }

    # Block access to sensitive files
    location ~* \.(json|xml|log|ini|cfg|bak|sql|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location block
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets (CSS, JS, Images, Fonts)
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files should not be cached
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zone (define in http block, use here)
    # limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # limit_req zone=general burst=20 nodelay;

    # Block bad bots
    if ($http_user_agent ~* (Scrapy|curl|wget|Python-urllib|Java|libwww|lwp-perl|Microsoft URL Control)) {
        return 403;
    }

    # Custom error pages (optional - create these files)
    # error_page 404 /404.html;
    # error_page 403 /403.html;
    # error_page 500 502 503 504 /50x.html;

    # CORS headers for API endpoints (if any)
    location /api/ {
        add_header Access-Control-Allow-Origin "https://infoycco.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://infoycco.com";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age "86400";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # PHP Security Settings (if PHP is used)
    # location ~ \.php$ {
    #     fastcgi_pass unix:/var/run/php/php-fpm.sock;
    #     fastcgi_param PHP_VALUE "display_errors=Off\nlog_errors=On\nexpose_php=Off\nallow_url_fopen=Off\nallow_url_include=Off";
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }
}

# HTTP to HTTPS redirect for www
server {
    listen 80;
    server_name www.infoycco.com;
    return 301 https://infoycco.com$request_uri;
}